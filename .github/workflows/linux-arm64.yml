name: Diagnose Linux ARM64

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out application
        uses: actions/checkout@v6

      - name: Create .env if required
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f .env ]; then
            echo "::notice::.env was not created because .env.example is missing"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            file \
            git \
            unzip \
            xz-utils \
            zip \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            golang-go \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true
        with:
          flutter-version: "3.35.2"
          channel: "stable"
          architecture: "arm64"

      - name: Capture ARM64 diagnostics
        shell: bash
        run: |
          set -euo pipefail

          summary_file="$GITHUB_STEP_SUMMARY"
          machine_json=""
          if command -v flutter >/dev/null 2>&1; then
            machine_json="$(mktemp)"
            if ! flutter --version --machine >"$machine_json" 2>/dev/null; then
              rm -f "$machine_json"
              machine_json=""
            fi
          fi

          {
            echo "ARM64 runner: available"
            echo "Flutter ARM64 host toolchain: unavailable"
            echo "Native ARM64 Flutter application build: not completed"
            echo "AArch64 DXcore: not supplied"
            echo "Functional ARM64 VPN: not proven"
            echo ""
            echo "Blockers:"
            echo "- Flutter Linux ARM64 host SDK/toolchain unavailable"
            echo "- Standard x64-to-ARM64 Flutter Linux cross-build unsupported"
            echo "- Real proprietary AArch64 libDXcore.so unavailable"
            echo ""
            echo "Host architecture: $(uname -m)"
            echo "uname -a:"
            uname -a
            echo ""
            echo "/etc/os-release:"
            cat /etc/os-release
            echo ""
            if [ -n "$machine_json" ] && [ -f "$machine_json" ]; then
              framework_revision="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(data.get("frameworkRevision", "unknown"))' "$machine_json")"
              engine_revision="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(data.get("engineRevision", "unknown"))' "$machine_json")"
              dart_sdk_url="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(data.get("dartSdkUrl") or "unavailable")' "$machine_json")"
              echo "Flutter framework revision: ${framework_revision}"
              echo "Engine revision: ${engine_revision}"
              echo "Requested Dart SDK URL: ${dart_sdk_url}"
              rm -f "$machine_json"
              flutter --version || true
              dart --version || true
              flutter doctor --verbose || true
            else
              echo "Flutter framework revision: unavailable"
              echo "Engine revision: unavailable"
              echo "Requested Dart SDK URL: unavailable"
              echo "::error::Flutter Linux ARM64 host SDK/toolchain is unavailable on this runner."
            fi
          } | tee -a "$summary_file"

          if ! command -v flutter >/dev/null 2>&1; then
            exit 1
          fi

      - name: Fail diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This workflow is diagnostic-only until a real Flutter Linux ARM64 host SDK/toolchain and proprietary AArch64 libDXcore.so are available."
          exit 1
